# Semantics discovery cannot supply.
#
# The catalog knows this table has an `event_time` column of type timestamptz.
# It does not know that column is what orders the data, and a temporal join
# needs to be told. Rediscovery preserves what is declared here.
apiVersion: gantry.dev/v1alpha1
kind: Dataset

metadata:
  name: public.request_logs

physical:
  adapter: postgres
  reference: public.request_logs

schema:
  keys: [request_id]

semantics:
  timeField: event_time

access:
  agentPolicy: aggregate_or_masked
