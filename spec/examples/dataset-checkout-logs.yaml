# Dataset manifest from the design document's Dataset and Signal Model.
#
# The manifest gives planners and agents enough metadata to reason about the
# data without reading it: `gantry dataset describe` never opens a connection.
apiVersion: gantry.dev/v1alpha1
kind: Dataset

metadata:
  name: checkout-logs

physical:
  adapter: clickhouse
  reference: observability.logs
  estimatedRows: 8400000000
  estimatedBytes: 14.2TB

schema:
  keys:
    - request_id
    - trace_id
    - service

statistics:
  changeRatePerSecond: 18000

semantics:
  timeField: event_time

access:
  agentPolicy: aggregate_or_masked

sensitiveFields:
  - user_email
  - payment_token
