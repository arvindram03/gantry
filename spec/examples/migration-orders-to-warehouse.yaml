# A migration composed from the Movement demo.
#
# The `cutover:` and `rollback:` blocks live here rather than in the Movement
# spec: a Movement makes data available, and does not imply that anyone has
# decided to switch traffic onto it. Deciding that is what a Migration is for.
apiVersion: gantry.dev/v1alpha1
kind: Migration

metadata:
  name: orders-to-warehouse

description: Move orders and customers onto the warehouse, then cut over.

movements:
  - orders-snapshot

cutover:
  gates:
    # Verified, not merely copied.
    allPartitionsVerified: true
    maxCdcLag: 2s
    criticalVerificationFailures: 0
    targetHealthy: true
    schemaCompatible: true
    # A recorded human decision. An agent may propose cutover; it cannot
    # approve one.
    requireApproval: true

rollback:
  # The source stays authoritative for a day. Traffic rollback, not a reverse
  # bulk migration.
  window: 24h
  sourceRemainsAuthoritative: true
