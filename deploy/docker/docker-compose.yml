name: gantry-dev

# Local development stack for Gantry v1.
#
# pg-source  : Movement source. wal_level=logical so Debezium can stream CDC.
# pg-target  : Movement target.
# pg-meta    : Gantry's own metadata store (operations, plans, checkpoints,
#              results, provenance, audit). Deliberately separate from both
#              data-plane databases - control state must survive them.
# kafka      : CDC transport (KRaft, single node).
# connect    : Kafka Connect + Debezium Postgres connector.
# prometheus : scrapes the Gantry worker running on the host.

x-postgres-common: &postgres-common
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: gantry
    POSTGRES_PASSWORD: gantry
    POSTGRES_DB: gantry
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U gantry -d gantry"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  pg-source:
    <<: *postgres-common
    container_name: gantry-pg-source
    ports: ["5433:5432"]
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_buffers=512MB
    volumes:
      - pg-source-data:/var/lib/postgresql/data
      - ./postgres/source-init.sql:/docker-entrypoint-initdb.d/10-source-init.sql:ro

  pg-target:
    <<: *postgres-common
    container_name: gantry-pg-target
    ports: ["5434:5432"]
    command:
      - postgres
      - -c
      - shared_buffers=512MB
    volumes:
      - pg-target-data:/var/lib/postgresql/data

  pg-meta:
    <<: *postgres-common
    container_name: gantry-pg-meta
    ports: ["5435:5432"]
    environment:
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: gantry
      POSTGRES_DB: gantry_meta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantry -d gantry_meta"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pg-meta-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: gantry-kafka
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: gantry-dev-cluster-00001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: gantry-connect
    restart: unless-stopped
    ports: ["8083:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      pg-source: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: gantry-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gantry-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pg-source-data:
  pg-target-data:
  pg-meta-data:
