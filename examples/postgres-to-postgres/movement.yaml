# The v1 demo Movement: PostgreSQL to PostgreSQL, snapshot of a 100M-row table.
#
# Dataset names are the source's qualified table names, which is what discovery
# registers them as. Partition bounds are not written here - they come from the
# Dataset manifest at plan time, so they reflect the data rather than a guess.
apiVersion: gantry.dev/v1alpha1
kind: Movement

metadata:
  name: orders-snapshot

source:
  adapter: postgres
  connectionRef: source

destination:
  adapter: postgres
  connectionRef: target

strategy:
  mode: snapshot

datasets:
  - name: public.customers
    source: public.customers
    target: public.customers
    key:
      columns: [customer_id]
    partitioning:
      strategy: range
      column: customer_id
      rowsPerPartition: 250000
    write:
      mode: upsert
    verification:
      required:
        - row_count
        - primary_key_unique

  - name: public.orders
    source: public.orders
    target: public.orders
    dependsOn:
      - public.customers
    key:
      columns: [order_id]
    partitioning:
      strategy: range
      column: order_id
      rowsPerPartition: 2000000
    write:
      mode: upsert
    verification:
      required:
        - row_count
        - chunk_checksum

runtime:
  maxConcurrency: 8
  maxRetries: 5
