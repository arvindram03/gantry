[project]
name = "data-gantry"
version = "0.5.0"
description = "A common execution control plane for agent-generated data work"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["sql", "agents", "llm", "governance", "flink", "duckdb", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# The distribution is `data-gantry`; the import stays `gantry`. The name
# `gantry` on PyPI belongs to an unrelated project.
[project.urls]
Homepage = "https://github.com/arvindram03/gantry"
Source = "https://github.com/arvindram03/gantry"
Issues = "https://github.com/arvindram03/gantry/issues"
Changelog = "https://github.com/arvindram03/gantry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
duckdb = ["duckdb>=1.1"]
bigquery = ["google-cloud-bigquery>=3.25"]
snowflake = ["snowflake-connector-python>=3.12"]
all-sql = [
    "asyncpg>=0.30",
    "duckdb>=1.1",
    "google-cloud-bigquery>=3.25",
    "snowflake-connector-python>=3.12",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "duckdb>=1.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gantry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["gantry", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
