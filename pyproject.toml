[project]
name = "data-gantry"
version = "0.5.0"
description = "A common execution control plane for agent-generated data work"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []
keywords = ["sql", "agents", "llm", "governance", "flink", "duckdb", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# The distribution is `data-gantry`; the import stays `gantry`. The name
# `gantry` on PyPI belongs to an unrelated project.
[project.urls]
Homepage = "https://github.com/arvindram03/gantry"
Source = "https://github.com/arvindram03/gantry"
Issues = "https://github.com/arvindram03/gantry/issues"
Changelog = "https://github.com/arvindram03/gantry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
duckdb = ["duckdb>=1.1"]
bigquery = ["google-cloud-bigquery>=3.25"]
snowflake = ["snowflake-connector-python>=3.12"]
all-sql = [
    "asyncpg>=0.30",
    "duckdb>=1.1",
    "google-cloud-bigquery>=3.25",
    "snowflake-connector-python>=3.12",
]

[dependency-groups]
# Documentation only. Kept out of `dev` so the ordinary check loop does not
# pull a site generator and its tree of dependencies.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "build>=1.2",
    "duckdb>=1.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gantry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["gantry", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ASYNC"]

[tool.mypy]
# `scripts/` is on the path because tests/test_capability_matrix.py imports the
# generator. Following that import means the script is type-checked too, which
# is right: the published matrix depends on it being correct.
mypy_path = "scripts"
# Deliberately unpinned. Pinning python_version meant the type check only ever
# saw 3.12 semantics, including on the 3.13 leg of CI, so a 3.13-only typing
# problem could not be caught. mypy follows the running interpreter instead.
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The coverage floor is enforced, not merely measured.
#
# 77 and not 78, even though the TOTAL line prints "78%". Two roundings
# disagree: pytest-cov decides the printed verdict from the precise figure
# (77.68), while the exit code comes from coverage.py comparing that figure
# rounded to the configured precision. At 78 the build stays green *and* every
# log carries "FAIL Required test coverage of 78% not reached" — a gate that
# contradicts itself in writing is worse than one set a point lower.
#
# At 77 the message and the exit code agree, and the build fails if coverage
# genuinely drops below 76.5. Raise it as coverage improves, and re-check the
# boundary rather than reading the rounded number off a log.
#
# It only applies when coverage is collected, so running a single test file is
# unaffected.
addopts = "--strict-markers --cov-fail-under=77"
