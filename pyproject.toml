[project]
name = "gantry"
version = "0.1.0.dev0"
description = "Open-source reliability and execution layer for data movement and analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Core stays deliberately small. Adapter ecosystems live in extras so database
# and agent SDK dependencies cannot conflict (spec section 17).
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3.2"]
kafka = ["aiokafka>=0.11"]
duckdb = ["duckdb>=1.1"]
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "prometheus-client>=0.21",
]
all = ["gantry[postgres,kafka,duckdb,telemetry]"]

[project.scripts]
gantry = "gantry.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gantry"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["gantry", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF", "ASYNC"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# Strict typing is a v1 definition-of-done item: no Any in public interfaces.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the docker-compose stack (make dev-up)",
    "chaos: fault-injection tests (worker kill, duplicate delivery, target stall)",
]
addopts = "-m 'not integration' --strict-markers"
